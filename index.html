<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Oops Out</title>
    <script>
      (function () {
        var official = "https://oops-out-septic-tank-services.vercel.app";
        var target = official + (window.location.hash || "");

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }

        if ("caches" in window) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }).finally(function () {
            window.location.replace(target);
          });
        } else {
          window.location.replace(target);
        }
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://oops-out-septic-tank-services.vercel.app" />
    </noscript>
  </head>
  <body>
    <a href="https://oops-out-septic-tank-services.vercel.app">Open Oops Out</a>
  </body>
</html>
